<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catatan Keuangan</title>

<style>
:root {
    --primary: #2c3e50;
    --success: #27ae60;
    --danger: #e74c3c;
    --secondary: #7f8c8d;
    --background: #f4f7f6;
}

* {
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: var(--background);
    margin: 0;
    padding: 20px;
    color: #333;
}

.container {
    width: 100%;
    max-width: 1200px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

h2 {
    text-align: center;
    color: var(--primary);
    margin-top: 0;
}

.form-box {
    background: #ebeef0;
    padding: 18px;
    border-radius: 8px;
    margin-bottom: 25px;
}

/* SECTION FILTER TANGGAL */
.filter-section {
    background: #ffffff;
    padding: 15px;
    border-radius: 6px;
    margin-bottom: 18px;
    border: 1px solid #dcdfe6;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 15px;
}

.filter-group {
    flex: 1;
    min-width: 200px;
}

.filter-group label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 6px;
    color: var(--primary);
}

.filter-group input {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
}

.form-row {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 15px;
    align-items: end;
}

.form-group label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 6px;
}

.form-group input {
    width: 100%;
    min-width: 0;
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
}

button {
    border: none;
    border-radius: 6px;
    cursor: pointer;
    color: white;
    font-weight: bold;
    padding: 11px 16px;
    min-height: 40px;
}

.btn-add {
    background: var(--success);
    width: 100%;
}

.btn-add:hover {
    background: #219653;
}

.btn-reset {
    background: var(--secondary);
    min-height: 38px;
    padding: 9px 15px;
    font-size: 13px;
}

.btn-reset:hover {
    background: #6c7a7d;
}

.form-button {
    grid-column: 1 / -1;
}

.table-wrapper {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    min-width: 650px;
}

th, td {
    padding: 12px 10px;
    text-align: left;
    border-bottom: 1px solid #ddd;
}

th {
    background: var(--primary);
    color: white;
    white-space: nowrap;
}

tr:hover {
    background: #f9f9f9;
}

.text-right {
    text-align: right;
}

.highlight-tgl4 {
    background: #e8f8f5 !important;
    font-weight: bold;
    color: #117a65;
}

.strip {
    color: #bbb;
    text-align: center;
}

.btn-delete {
    background: var(--danger);
    padding: 7px 10px;
    font-size: 12px;
    min-height: 32px;
}

.btn-delete:hover {
    background: #c0392b;
}

/* KARTU MOBILE */
.mobile-list {
    display: none;
}

.card-transaction {
    background: white;
    border: 1px solid #ddd;
    border-radius: 9px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 2px 5px rgba(0,0,0,.04);
}

.card-transaction.highlight-tgl4 {
    border: 2px solid #1abc9c;
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
}

.card-date {
    font-weight: bold;
    color: var(--primary);
}

.card-description {
    font-weight: 600;
    margin-bottom: 12px;
    overflow-wrap: anywhere;
}

.card-detail {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.card-detail div {
    background: #f5f7f8;
    padding: 9px;
    border-radius: 6px;
    min-width: 0;
    overflow-wrap: anywhere;
}

.card-detail small {
    display: block;
    color: #777;
    margin-bottom: 5px;
}

.card-detail strong {
    font-size: 13px;
}

.card-total {
    margin-top: 10px;
    background: #e8f8f5;
    padding: 10px;
    border-radius: 6px;
    color: #117a65;
}

.empty-data {
    text-align: center;
    padding: 25px;
    color: #888;
}

/* TABLET */
@media (max-width: 900px) {
    .form-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .container {
        padding: 18px;
    }
}

/* MOBILE */
@media (max-width: 600px) {
    body {
        padding: 10px;
    }

    .container {
        padding: 15px;
        border-radius: 8px;
    }

    h2 {
        font-size: 20px;
    }

    .form-row {
        grid-template-columns: 1fr;
        gap: 12px;
    }

    .form-button {
        grid-column: auto;
    }

    .form-box {
        padding: 12px;
    }

    .table-wrapper {
        display: none;
    }

    .mobile-list {
        display: block;
    }
}
</style>
</head>

<body>

<div class="container">

<h2>Catatan Keuangan</h2>

<div class="form-box">
    <!-- BAGIAN FILTER TANGGAL -->
    <div class="filter-section">
        <div class="filter-group">
            <label for="filter-tgl">🔍 Filter Tanggal:</label>
            <input type="date" id="filter-tgl">
        </div>
        <button type="button" class="btn-reset" id="btn-reset-filter">
            Tampilkan Semua
        </button>
    </div>

    <!-- FORM INPUT TRANSAKSI -->
    <form id="finance-form">
        <div class="form-row">
            <div class="form-group">
                <label for="input-tgl">Tanggal Transaksi</label>
                <input type="date" id="input-tgl" required>
            </div>

            <div class="form-group">
                <label for="input-ket">Keterangan</label>
                <input type="text" id="input-ket" placeholder="nama pemesan" required>
            </div>

            <div class="form-group">
                <label for="input-keluar">Keluar (-)</label>
                <input type="number" id="input-keluar" value="0" min="0">
            </div>

            <div class="form-group">
                <label for="input-masuk">Masuk (+)</label>
                <input type="number" id="input-masuk" value="0" min="0">
            </div>

            <div class="form-button">
                <button type="submit" class="btn-add">
                    KONFIRMASI TRANSAKSI
                </button>
            </div>
        </div>
    </form>
</div>

<!-- TAMPILAN DESKTOP -->
<div class="table-wrapper">
<table>
<thead>
<tr>
    <th>Tanggal</th>
    <th>Keterangan</th>
    <th class="text-right">Keluar (-)</th>
    <th class="text-right">Masuk (+)</th>
    <th class="text-right">Terkumpul</th>
    <th>Aksi</th>
</tr>
</thead>

<tbody id="transaction-table"></tbody>
</table>
</div>

<!-- TAMPILAN MOBILE -->
<div class="mobile-list" id="mobile-list"></div>

</div>

<script>

// DATA TRANSAKSI
const defaultData = [];
let databaseTransaksi;

try {
    const saved = localStorage.getItem('keuanganMultiData');
    databaseTransaksi = saved === null ? defaultData : JSON.parse(saved);

    if (!Array.isArray(databaseTransaksi)) {
        databaseTransaksi = defaultData;
    }
} catch (error) {
    databaseTransaksi = defaultData;
}

const inputTanggal = document.getElementById('input-tgl');
inputTanggal.valueAsDate = new Date();

const filterTanggal = document.getElementById('filter-tgl');
const btnResetFilter = document.getElementById('btn-reset-filter');

// EVENT LISTENER FILTER
filterTanggal.addEventListener('change', renderTabel);

btnResetFilter.addEventListener('click', () => {
    filterTanggal.value = '';
    renderTabel();
});

function simpanData() {
    localStorage.setItem('keuanganMultiData', JSON.stringify(databaseTransaksi));
}

function formatRupiah(angka) {
    if (angka === 0) return '-';
    return 'Rp' + Number(angka).toLocaleString('id-ID');
}

function formatTanggal(tanggal) {
    const [tahun, bulan, hari] = tanggal.split('-');
    return `${hari}/${bulan}/${tahun}`;
}

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#039;'
    })[char]);
}

function renderTabel() {
    const tbody = document.getElementById('transaction-table');
    const mobile = document.getElementById('mobile-list');

    tbody.innerHTML = '';
    mobile.innerHTML = '';

    // Sort data berdasarkan tanggal dan ID
    let sortedData = [...databaseTransaksi].sort((a,b) =>
        a.tanggal.localeCompare(b.tanggal) || a.id - b.id
    );

    // FILTER TANGGAL: Jika input filter diisi, saring data sesuai tanggal yang dipilih
    const selectedDate = filterTanggal.value;
    const dataToRender = selectedDate 
        ? sortedData.filter(item => item.tanggal === selectedDate)
        : sortedData;

    let akumulasiMasuk = 0;
    const indeksTerakhirTgl4 = {};

    dataToRender.forEach((item, index) => {
        if (Number(item.tanggal.split('-')[2]) === 4) {
            indeksTerakhirTgl4[item.tanggal] = index;
        }
    });

    if (dataToRender.length === 0) {
        const pesanKosong = selectedDate 
            ? `Belum ada transaksi pada tanggal ${formatTanggal(selectedDate)}` 
            : 'Belum ada transaksi';

        tbody.innerHTML = `<tr><td colspan="6" class="empty-data">${pesanKosong}</td></tr>`;
        mobile.innerHTML = `<div class="empty-data">${pesanKosong}</div>`;
        return;
    }

    dataToRender.forEach((item, index) => {
        akumulasiMasuk += Number(item.masuk) || 0;

        const isTanggal3 = Number(item.tanggal.split('-')[2]) === 4;
        const isLast = indeksTerakhirTgl4[item.tanggal] === index;

        const total = isLast ? formatRupiah(akumulasiMasuk) : '-';
        const keterangan = escapeHTML(item.keterangan);
        const tanggal = formatTanggal(item.tanggal);

        // TAMPILAN DESKTOP
        const tr = document.createElement('tr');
        if (isTanggal3) {
            tr.classList.add('highlight-tgl4');
        }

        tr.innerHTML = `
            <td>${tanggal}</td>
            <td>${keterangan}</td>
            <td class="text-right">${formatRupiah(Number(item.keluar))}</td>
            <td class="text-right">${formatRupiah(Number(item.masuk))}</td>
            <td class="text-right">${total}</td>
            <td>
                <button class="btn-delete" onclick="hapusTransaksi(${Number(item.id)})">
                    Hapus
                </button>
            </td>
        `;
        tbody.appendChild(tr);

        // TAMPILAN MOBILE
        const card = document.createElement('div');
        card.className = 'card-transaction';

        if (isTanggal3) {
            card.classList.add('highlight-tgl4');
        }

        card.innerHTML = `
            <div class="card-header">
                <span class="card-date">${tanggal}</span>
                <button class="btn-delete" onclick="hapusTransaksi(${Number(item.id)})">
                    Hapus
                </button>
            </div>

            <div class="card-description">
                ${keterangan}
            </div>

            <div class="card-detail">
                <div>
                    <small>Keluar (-)</small>
                    <strong>${formatRupiah(Number(item.keluar))}</strong>
                </div>

                <div>
                    <small>Masuk (+)</small>
                    <strong>${formatRupiah(Number(item.masuk))}</strong>
                </div>
            </div>

            ${isLast ? `
                <div class="card-total">
                    <small>Terkumpul</small>
                    <strong>${total}</strong>
                </div>
            ` : ''}
        `;
        mobile.appendChild(card);
    });
}

// TAMBAH TRANSAKSI
document.getElementById('finance-form').addEventListener('submit', function(e) {
    e.preventDefault();

    const tanggal = document.getElementById('input-tgl').value;
    const keterangan = document.getElementById('input-ket').value.trim();
    const keluar = Number(document.getElementById('input-keluar').value) || 0;
    const masuk = Number(document.getElementById('input-masuk').value) || 0;

    if (!tanggal || !keterangan) return;

    if (keluar < 0 || masuk < 0) {
        alert('Nominal tidak boleh negatif');
        return;
    }

    if (keluar === 0 && masuk === 0) {
        alert('Masukkan nominal keluar atau masuk');
        return;
    }

    databaseTransaksi.push({
        id: Date.now(),
        tanggal,
        keterangan,
        keluar,
        masuk
    });

    simpanData();

    document.getElementById('input-ket').value = '';
    document.getElementById('input-keluar').value = '0';
    document.getElementById('input-masuk').value = '0';

    renderTabel();
});

// HAPUS TRANSAKSI
window.hapusTransaksi = function(id) {
    if (!confirm('Hapus catatan ini?')) return;

    databaseTransaksi = databaseTransaksi.filter(item => item.id !== id);

    simpanData();
    renderTabel();
};

// JALANKAN PERTAMA KALI
renderTabel();

</script>

</body>
</html>
